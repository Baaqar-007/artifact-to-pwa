name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: 

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js and npm registry auth (OIDC)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@baaqar'
          always-auth: true

      - name: Install dependencies
        run: npm ci

      - name: Verify npm auth (debug)
        run: |
          echo "node version: $(node --version)"
          echo "npm version: $(npm --version)"
          npm whoami || echo "not authenticated"

      - name: Publish to npm
        run: npm publish --provenance --access public --verbose